<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500">
<style>

        .ascii-row {
            font-family: monospace;
            font-size: 10px;
            fill: #666666;
            white-space: pre;
        }

        .row {
            animation: reveal 0.55s ease-out forwards;
            clip-path: inset(0 100% 0 0);
        }

        @keyframes reveal {
            from {
                clip-path: inset(0 100% 0 0);
            }
            to {
                clip-path: inset(0 0 0 0);
            }
        }
        
</style>
