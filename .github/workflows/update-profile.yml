name: Update GitHub Profile

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Fetch contributions
        env:
          GH_PROFILE_USER: anaskhan-pd
        run: |
          python scripts/fetch_contributions.py

      - name: Generate contribution graph
        run: |
          python scripts/generate_streak_svg.py anaskhan-pd contrib-heatmap.svg

      - name: Regenerate ASCII portrait
        run: |
          python scripts/prep_photo.py source-photo.png source-prepped.png
          python scripts/make_ascii_svg.py source-prepped.png anaskhan-ascii.svg

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add contrib-heatmap.svg anaskhan-ascii.svg data/

          git diff --cached --quiet || git commit -m "update profile graphics"

          git push
